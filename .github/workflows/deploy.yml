name: CI/CD Pipeline

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - main

jobs:
  deploy-infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: set-variables
        shell: "pwsh"
        run: |
          @("ARM_CLIENT_ID=${{ secrets.ARM_CLIENT_ID }}",
            "ARM_SUBSCRIPTION_ID=${{ secrets.ARM_SUBSCRIPTION_ID }}",
            "ARM_TENANT_ID=${{ secrets.ARM_TENANT_ID }}",
            "ARM_USE_OIDC=true",
            "ARM_USE_AZUREAD=true") | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Initialize Terraform
        shell: "pwsh"
        run: terraform init

      - name: Plan Terraform Changes
        shell: "pwsh"
        run: terraform plan

      - name: Apply Terraform Changes
        shell: "pwsh"
        run: terraform apply -auto-approve

  frontend-build-push:
    name: Build and Push Frontend Docker Image
    runs-on: ubuntu-latest
    needs: deploy-infra

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: "Azure Login"
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Create .env.local from GitHub Secretes
        run: |
          echo "NEXT_PUBLIC_REDIRECT_URI=${{ secrets.NEXT_PUBLIC_REDIRECT_URI }}" > .env.local
          echo "NEXT_PUBLIC_SPA_CLIENT_ID=${{ secrets.NEXT_PUBLIC_SPA_CLIENT_ID }}" >> .env.local
          echo "NEXT_PUBLIC_API_CLIENT_ID=${{ secrets.NEXT_PUBLIC_API_CLIENT_ID }}" >> .env.local
          echo "NEXT_PUBLIC_ENTRA_TENANT_ID=${{ secrets.ARM_TENANT_ID }}" >> .env.local
          echo "NEXT_PUBLIC_ENTRA_TENANT_NAME=${{ secrets.NEXT_PUBLIC_ENTRA_TENANT_NAME }}" >> .env.local

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ secrets.ACR_LOGIN_SERVER }}

      - name: Build Docker Image
        run: |
          docker build \
            --secret id=envfile,src=.env.local \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/notewise-frontend:latest ./notewise-frontend

      - name: Push Docker Image to ACR
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/notewise-frontend:latest

  backend-build-push:
    name: Build and Push Backend Docker Image
    runs-on: ubuntu-latest
    needs: deploy-infra

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: "Azure Login"
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Debug folder structure
        run: ls -R

      - name: Create .env from GitHub Secretes
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> notewise-backend-v2/.env
          echo "AZURE_STORAGE_ACCOUNT_NAME=${{ secrets.NEXT_PUBLIC_ENTRA_TENANT_NAME }}" >> notewise-backend-v2/.env
          echo "AZURE_STORAGE_ACCOUNT_KEY=${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}" >> notewise-backend-v2/.env
          echo "AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" >> notewise-backend-v2/.env
          echo "AZURE_SAS_TTL_MINUTES=${{ secrets.AZURE_SAS_TTL_MINUTES }}" >> notewise-backend-v2/.env
          echo "ENTRA_TENANT_ID=${{ secrets.ARM_TENANT_ID }}" >> notewise-backend-v2/.env
          echo "ENTRA_TENANT_NAME=${{ secrets.NEXT_PUBLIC_ENTRA_TENANT_NAME }}" >> notewise-backend-v2/.env
          echo "API_CLIENT_ID=${{ secrets.NEXT_PUBLIC_API_CLIENT_ID }}" >> notewise-backend-v2/.env

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ secrets.ACR_LOGIN_SERVER }}

      - name: Build Docker Image
        run: |
          docker build \
            --secret id=envfile,src=notewise-backend-v2/.env \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/notewise-backend:latest ./notewise-backend-v2

      - name: Push Docker Image to ACR
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/notewise-backend:latest
