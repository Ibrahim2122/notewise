name: Build and Push Frontend Docker Image to ACR

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - "notewise-frontend/**"

  workflow_dispatch:

jobs:
  build:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Create .env.local from GitHub Secrets
        run: |
          echo "NEXT_PUBLIC_REDIRECT_URI=${{ secrets.NEXT_PUBLIC_REDIRECT_URI }}" > .env.local
          echo "NEXT_PUBLIC_SPA_CLIENT_ID=${{ secrets.NEXT_PUBLIC_SPA_CLIENT_ID }}" >> .env.local
          echo "NEXT_PUBLIC_API_CLIENT_ID=${{ secrets.NEXT_PUBLIC_API_CLIENT_ID }}" >> .env.local
          echo "NEXT_PUBLIC_ENTRA_TENANT_ID=${{ secrets.ARM_TENANT_ID }}" >> .env.local
          echo "NEXT_PUBLIC_ENTRA_TENANT_NAME=${{ secrets.NEXT_PUBLIC_ENTRA_TENANT_NAME }}" >> .env.local

      - name: Build Docker Image
        run: |
          docker build \
            --secret id=envfile,src=.env.local \
            -t notewise-frontend:latest ./notewise-frontend

      - name: Save Docker Image as Tarball
        run: docker save notewise-frontend:latest -o notewise-frontend.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notewise-frontend-image
          path: notewise-frontend.tar
          retention-days: 1

  push:
    name: Push Frontend Docker Image to ACR
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: notewise-frontend-image

      - name: Load Docker Image from Tarball
        run: docker load -i notewise-frontend.tar

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ secrets.ACR_LOGIN_SERVER }}

      - name: Tag Docker Image for ACR
        run: |
          docker tag notewise-frontend:latest \
            ${{ secrets.ACR_LOGIN_SERVER }}/notewise-frontend:latest

      - name: Push Docker Image to ACR
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/notewise-frontend:latest
